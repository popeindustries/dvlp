<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DVLP: test-browser</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="node_modules/mocha/mocha.css" />
  </head>
  <body>
    <div id="mocha"></div>
    <script src="node_modules/chai/chai.js" type="module"></script>
    <script src="node_modules/mocha/mocha.js"></script>
    <script class="mocha-init">
      mocha.setup('bdd');
      mocha.checkLeaks(false);
    </script>
    <script type="module" src="./mock-test.js"></script>
    <script type="module" class="mocha-exec">
      const runner = mocha.run();

      // Forward runner events to the terminal spec reporter when run
      // headless via "pnpm run test:browser:headless"
      if (window.electronMocha) {
        const events = [
          'start',
          'suite',
          'suite end',
          'pass',
          'fail',
          'pending',
          'end',
        ];

        for (const name of events) {
          runner.on(name, (...args) => {
            window.electronMocha.sendEvent(
              name,
              { ...runner.stats },
              ...args.map(serialize),
            );
          });
        }
      }

      function serialize(arg) {
        if (arg instanceof Error) {
          return { message: arg.message, stack: arg.stack };
        }
        if (arg != null && typeof arg === 'object') {
          return arg.serialize?.() ?? JSON.parse(JSON.stringify(arg));
        }
        return arg;
      }
    </script>
  </body>
</html>
